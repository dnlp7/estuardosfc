<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Estuardos FC — Estadísticas</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <button type="button" class="site-badge-btn" id="site-badge-btn" aria-label="Inicio">
      <img src="images/Escudo.png" alt="Estuardos FC" class="site-badge">
    </button>
  </header>

  <nav class="tabs main-nav">
    <button class="tab-btn main-tab-btn" data-section="plantel">Plantel</button>
    <button class="tab-btn main-tab-btn active" data-section="estadisticas">Estadísticas</button>
    <button class="tab-btn main-tab-btn" data-section="historia">Historia</button>
  </nav>

  <nav class="tabs sub-nav" id="estadisticas-subnav">
    <button class="tab-btn active" data-tab="temporada">Equipo</button>
    <button class="tab-btn" data-tab="historial">Jugadores</button>
  </nav>

  <main>
    <!-- Home page — reached only via the badge in the header, never the
         nav bar (see app.js setupInicio_). No matching .main-tab-btn on
         purpose: activateSection_'s "no button matches this name" case
         is exactly the right look here, same as Perfil. Empty for now —
         content coming later. -->
    <section id="section-inicio" class="section-panel"></section>

    <section id="section-estadisticas" class="section-panel active">
      <section id="tab-temporada" class="tab-panel active">
        <div class="controls">
          <select id="team-era-filter">
            <option value="__all__">Todas las temporadas</option>
          </select>
        </div>

        <p id="team-message" class="detail-message" hidden></p>

        <div id="team-season-detail" hidden>
          <div class="table-wrap compact" id="standings-wrap">
            <table id="standings-table">
              <thead>
                <tr>
                  <th>PJ</th><th>PG</th><th>PE</th><th>PP</th>
                  <th>GF</th><th>GC</th><th>DIF</th><th>PTS</th>
                </tr>
              </thead>
              <tbody></tbody>
            </table>
          </div>

          <h3>Resultados</h3>
          <div class="table-wrap" id="matches-wrap">
            <table id="matches-table">
              <thead>
                <tr>
                  <th>Jor.</th><th>R</th><th>Marc.</th>
                  <th>Rival</th><th>Fecha</th><th>Hora</th><th>C</th>
                </tr>
              </thead>
              <tbody></tbody>
            </table>
          </div>
        </div>

        <div class="table-wrap compact" id="team-balance-wrap">
          <table id="team-balance-table">
            <thead>
              <tr>
                <th>Temporada</th><th>PJ</th><th>PG</th><th>PE</th><th>PP</th>
                <th>GF</th><th>GC</th><th>DIF</th><th>PTS</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </section>

      <section id="tab-historial" class="tab-panel">
        <div class="controls">
          <div class="stat-selector" id="stat-selector">
            <button class="stat-btn active" data-stat="BALANCE">BALANCE</button>
            <button class="stat-btn" data-stat="GOL">GOL</button>
            <button class="stat-btn" data-stat="AST">AST</button>
            <button class="stat-btn" data-stat="PA">PA</button>
            <button class="stat-btn" data-stat="PI">PI</button>
          </div>
          <input type="search" id="player-search" placeholder="Buscar jugador...">
          <select id="era-filter">
            <option value="__all__">Todas las temporadas</option>
          </select>
          <label class="detail-toggle">
            <input type="checkbox" id="detail-toggle">
            <span>Mostrar detalle</span>
          </label>
        </div>

        <h3 id="stat-title">BALANCE</h3>

        <p id="detail-message" class="detail-message" hidden></p>

        <div class="table-wrap compact" id="leaderboard-wrap">
          <table id="leaderboard-table">
            <thead>
              <tr><th>#</th><th>N°</th><th>Jugador</th><th id="leaderboard-value-header">TOT</th></tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </section>
    </section>

    <section id="section-plantel" class="section-panel">
      <div class="plantel-grid" id="plantel-grid"></div>
    </section>

    <!-- Empty for now — content coming later. -->
    <section id="section-historia" class="section-panel"></section>

    <section id="section-perfil" class="section-panel">
      <button type="button" class="perfil-volver" id="perfil-volver">&larr; Volver al Plantel</button>

      <div class="perfil-header">
        <img id="perfil-foto" class="perfil-foto" src="" alt="">
        <div class="perfil-info">
          <p id="perfil-dorsal" class="perfil-dorsal"></p>
          <h2 id="perfil-nombre"></h2>
          <p id="perfil-nombre-completo" class="perfil-nombre-completo"></p>
          <p id="perfil-debut-row" class="perfil-detalle">Debut <span id="perfil-debut" class="perfil-valor"></span></p>
          <p id="perfil-cumple-row" class="perfil-detalle">Cumpleaños <span id="perfil-cumple" class="perfil-valor"></span></p>
        </div>
      </div>

      <div class="insignias-grid" id="perfil-insignias"></div>

      <h3>Estadísticas</h3>
      <div class="table-wrap compact" id="perfil-stats-wrap">
        <table id="perfil-stats-table">
          <thead>
            <tr><th>Temporada</th><th>GOL</th><th>AST</th><th>PA</th><th>PI</th></tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="social-links">
      <a href="https://www.instagram.com/estuardosfc" target="_blank" rel="noopener noreferrer"><img src="images/social/instagram.png" alt="Instagram"></a>
      <a href="https://www.facebook.com/EstuardosFC" target="_blank" rel="noopener noreferrer"><img src="images/social/facebook.png" alt="Facebook"></a>
      <a href="https://www.threads.net/@estuardosfc" target="_blank" rel="noopener noreferrer"><img src="images/social/threads.png" alt="Threads"></a>
      <a href="https://x.com/estuardosfc" target="_blank" rel="noopener noreferrer"><img src="images/social/twitter.png" alt="Twitter"></a>
      <a href="https://bsky.app/profile/estuardosfc.bsky.social" target="_blank" rel="noopener noreferrer"><img src="images/social/bluesky.png" alt="Bluesky"></a>
      <a href="https://www.youtube.com/@estuardosfc" target="_blank" rel="noopener noreferrer"><img src="images/social/youtube.png" alt="YouTube"></a>
      <span class="social-label">@estuardosfc</span>
    </div>
    <p class="updated" id="updated-at"></p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
