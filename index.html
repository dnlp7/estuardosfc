<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Estuardos FC — Estadísticas</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <h1>Estuardos FC</h1>
    <p class="subtitle">Estadísticas del equipo</p>
  </header>

  <nav class="tabs">
    <button class="tab-btn active" data-tab="temporada">Temporada Actual</button>
    <button class="tab-btn" data-tab="historial">Historial</button>
  </nav>

  <main>
    <section id="tab-temporada" class="tab-panel active">
      <h2 id="temporada-era">Temporada</h2>

      <div class="standings-card" id="standings-card"></div>

      <h3>Resultados</h3>
      <div class="table-wrap">
        <table id="matches-table">
          <thead>
            <tr>
              <th>Jor.</th><th>Cancha</th><th>Fecha</th><th>Hora</th>
              <th>R</th><th>GF</th><th>GC</th><th>Rival</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </section>

    <section id="tab-historial" class="tab-panel">
      <div class="controls">
        <div class="stat-selector" id="stat-selector">
          <button class="stat-btn active" data-stat="GOL">GOL</button>
          <button class="stat-btn" data-stat="AST">AST</button>
          <button class="stat-btn" data-stat="PA">PA</button>
          <button class="stat-btn" data-stat="PI">PI</button>
        </div>
        <input type="search" id="player-search" placeholder="Buscar jugador...">
        <select id="era-filter">
          <option value="__all__">Todas las temporadas</option>
        </select>
      </div>

      <h3 id="stat-title">GOLES ANOTADOS</h3>

      <div class="table-wrap">
        <table id="leaderboard-table">
          <thead>
            <tr><th>#</th><th>N°</th><th>Jugador</th><th id="leaderboard-value-header">TOT</th></tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <p class="updated" id="updated-at"></p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
